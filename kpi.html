<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>KPI พราวเอ็กซ์เพรส</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f3f2;--surface:#fff;--line:#e4dcda;--fg:#1f1716;--muted:#6d5f5c;--brand:#b0141f;--brand-ink:#fff;--brand-soft:#f7e3e4;
--ok:#1d7a46;--ok-soft:#e1f3e8;--warn:#9a6200;--warn-soft:#fbefd6;--bad:#b0141f;--bad-soft:#f7e3e4;--mid:#3c6fb0;--mid-soft:#e3ecf7;
--f-display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;--f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;--r:10px;
--c1:#2a6fdb;--c2:#e07b00;--c3:#1d9a5b;--c4:#c2185b;--c5:#6a4fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171212;--surface:#211a19;--line:#3a2f2d;--fg:#f2eceb;--muted:#b3a5a2;--brand:#d8343f;--brand-soft:#3a1d1f;
--ok:#5cc58a;--ok-soft:#18301f;--warn:#e3a94a;--warn-soft:#352914;--bad:#ef6b72;--bad-soft:#3a1d1f;--mid:#7fa7e0;--mid-soft:#1c2636;--c1:#6ea2f5;--c2:#f2a446;--c3:#5cc58a;--c4:#f06292;--c5:#a58be0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171212;--surface:#211a19;--line:#3a2f2d;--fg:#f2eceb;--muted:#b3a5a2;--brand:#d8343f;--brand-soft:#3a1d1f;--ok:#5cc58a;--ok-soft:#18301f;--warn:#e3a94a;--warn-soft:#352914;--bad:#ef6b72;--bad-soft:#3a1d1f;--mid:#7fa7e0;--mid-soft:#1c2636;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 1.1rem var(--f-display);line-height:1.2}.logo small{display:block;font-weight:500;font-size:.78rem;opacity:.85}
.who{margin-left:auto;font-size:.88rem;opacity:.95;text-align:right}
h2{font:700 1.15rem var(--f-display);margin:18px 0 8px}h3{font:600 1rem var(--f-display);margin:14px 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--brand);color:var(--brand-ink);font:600 .95rem var(--f-display);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
header .btn.ghost{color:var(--brand-ink);border-color:rgba(255,255,255,.5)}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}label.f>*{color:var(--fg)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-display);padding:8px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:.86rem}
.note{padding:9px 12px;border-radius:8px;background:var(--mid-soft);margin:8px 0;font-size:.92rem}.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.ok{background:var(--ok-soft)}
.kin{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kin:last-child{border-bottom:0}.kin .nm{font-weight:600}.kin .tg{font-size:.84rem;color:var(--muted)}
.kin input{width:140px;text-align:right}.kin .parts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kin .parts label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column}.kin .parts input{width:90px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-family:var(--f-display);font-weight:600;z-index:1;text-align:center;white-space:normal;min-width:70px}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
tr.sum td{font-weight:700;background:var(--mid-soft)}tr.sum td:first-child{background:var(--mid-soft)}
.s5,.s4{background:var(--ok-soft)}.s3,.s2{background:var(--warn-soft)}.s1,.s0{background:var(--bad-soft)}
.badge{display:inline-block;min-width:26px;padding:1px 7px;border-radius:999px;font-weight:700;text-align:center;font-size:.85rem}
.badge.s5,.badge.s4{color:var(--ok)}.badge.s3,.badge.s2{color:var(--warn)}.badge.s1,.badge.s0{color:var(--bad)}.badge.na{background:var(--line);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.big{font:700 2rem var(--f-display);line-height:1.1}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--brand)}
.money{color:var(--ok);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.82rem;color:var(--fg)}
.thumbs img{max-width:100%;max-height:60vh;display:block}
.mx td,.mx th{text-align:center}.mx td:first-child{text-align:left;white-space:normal;min-width:180px}
.set td{padding:3px}.set input{width:76px}.set input.nm{width:230px}.set input.u{width:70px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#lb img{max-width:100%;max-height:90vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;max-width:90vw;font-size:.92rem}
.login{max-width:420px;margin:30px auto}
svg text{fill:var(--muted);font:12px var(--f-body)}
@media (max-width:600px){.kin{grid-template-columns:1fr}.kin input{width:100%}.kin .parts{justify-content:flex-start}.who{margin-left:0;text-align:left}}
@media print{header,.tabs,.noprint{display:none!important}body{background:#fff;color:#000}.panel{border:0}}
</style></head><body>
<header class="top"><div class="wrap"><div class="logo">KPI คลังสินค้า<small>บริษัท พราวเอ็กซ์เพรส จำกัด</small></div><div class="who" id="who"></div></div></header>
<main class="wrap" id="app"><p class="muted">กำลังโหลด…</p></main>
<div id="toast" hidden></div><div id="lb" hidden></div>
<script>
// ===== ใส่ URL ของ Apps Script (ตัวเดียวกับไฟล์ index.html) ระหว่างเครื่องหมาย ' ' =====
const API_URL='https://script.google.com/macros/s/AKfycbw2Gf7NX4huSWPWLx257MhUwB2EHxhowh0ugVg61_rAaLufeJaAUrvmRqJLkBFLFUFA/exec';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={tok:'',d:null,month:'',branch:'',tab:'',date:'',set:'',defEdit:null,lm:'bo',busy:false,chartK:''};
try{K.tok=sessionStorage.getItem('hr_t')||''}catch(e){}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3500)}
async function api(a,p){let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({a,t:K.tok},p||{}))})}catch(e){throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ต')}
  const j=await r.json();if(!j.ok){if(j.error==='SESSION_EXPIRED'){K.tok='';try{sessionStorage.removeItem('hr_t')}catch(e){}K.d=null;render();throw new Error('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าใหม่')}throw new Error(j.error)}return j.r}
const pad=n=>('0'+n).slice(-2),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const mLabel=m=>{const[y,mo]=m.split('-');return TH_M[+mo-1]+' '+(+y+543)};
const dLabel=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)};
const money=()=>K.d&&['admin','hr'].includes(K.d.me.role);
const kind=()=>K.d&&K.d.who.kind;   // admin hr rm spv adm
const setOf=b=>K.d.def.sets[K.d.def.branchSet[b]];
const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(Math.round(m%60))};
function fv(k,v,daily){if(v==null||v==='')return '';if(k.time||(daily&&k.agg==='late'))return hm(v);if(k.agg==='late')return v+' ครั้ง';if(k.unit==='%')return (+v).toFixed(2)+'%';return (+v).toLocaleString('th-TH',{maximumFractionDigits:2})}
const target=k=>{const t=k.th[0];if(k.agg==='late')return 'เข้างานไม่เกิน '+(k.at||'07:00')+' น. · สาย 0 ครั้ง = 5 คะแนน';return 'เป้า '+(k.dir==='hi'?'≥ ':'≤ ')+(k.time?hm(t):fv(k,t))+(k.agg==='sum'?' (รวมทั้งเดือน)':k.agg==='avg'?' (เฉลี่ยทั้งเดือน)':'')};
function score(k,v){if(v==null||v===''||isNaN(v))return null;for(let i=0;i<5;i++){const t=k.th[i];if(t==null||t==='')continue;if(k.dir==='hi'?v>=t:v<=t)return 5-i}return 0}
function dayCls(k,v){if(v==null||v==='')return '';if(k.agg==='late'){return v>toMin(k.at||'07:00')?'s0':'s5'}if(k.agg==='sum')return '';const s=score(k,v);return s==null?'':'s'+s}
const toMin=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const badge=s=>s==null?'<span class="badge na">–</span>':`<span class="badge s${s}">${s}</span>`;
const baht=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})+' บาท';
const thisMonth=()=>iso(new Date()).slice(0,7);
const branches=()=>Object.keys(K.d.branches);

async function load(m){K.busy=true;try{K.d=await api('kpiLoad',{month:m||K.month||thisMonth()});K.month=K.d.month;if(!K.branch||!K.d.branches[K.branch])K.branch=branches()[0]||'';if(!K.date)K.date=K.d.today;
  const tabs=tabList().map(t=>t[0]);if(!tabs.includes(K.tab))K.tab=tabs[0]}finally{K.busy=false}render()}
function tabList(){const k=kind(),t=[];if(k!=='rm')t.push(['entry','📝 กรอกผลรายวัน']);t.push(['daily','📅 ผลรายวัน'],['sum','🏆 สรุปคะแนน']);
  if(['spv','admin','hr','rm','adm'].includes(k))t.push(['asg','👥 ผู้รับผิดชอบ']);if(['rm','admin','hr'].includes(k))t.push(['sub','🚚 การใช้ซัพ']);
  if(money())t.push(['close','🧾 ปิดเดือน / พิมพ์']);if(k==='admin')t.push(['set','⚙️ ตั้งค่าหัวข้อ']);return t}

function render(){const app=$('#app');
  if(!K.d){$('#who').innerHTML='';app.innerHTML=loginView();bindLogin();return}
  const me=K.d.me,RN={admin:'แอดมิน',hr:'HR',rm:'RM',spv:'SPV',emp:'ธุรการ (ADMIN)'};
  $('#who').innerHTML=`<b>${esc(me.name)}</b> · ${RN[me.role]||me.role}${K.d.who.branch?' คลัง '+esc(K.d.who.branch):''}<br><button class="btn ghost sm" id="k-out">ออกจากระบบ</button> <a class="btn ghost sm" href="./" style="text-decoration:none">ระบบพนักงาน</a>`;
  const ms=[];{const d=new Date();d.setDate(1);for(let i=0;i<13;i++){ms.push(iso(d).slice(0,7));d.setMonth(d.getMonth()-1)}}if(!ms.includes(K.month))ms.push(K.month);
  const bs=branches();
  app.innerHTML=`<div class="row noprint" style="margin-top:12px"><label class="f">เดือน<select id="k-m">${ms.map(m=>`<option value="${m}"${m===K.month?' selected':''}>${mLabel(m)}</option>`).join('')}</select></label>
   ${bs.length>1?`<label class="f">คลัง<select id="k-b">${bs.map(b=>`<option${b===K.branch?' selected':''}>${esc(b)}</option>`).join('')}</select></label>`:''}
   <span class="muted sm" style="margin-left:auto">${K.d.closed?'🔒 เดือนนี้ปิดแล้ว':'เดือนนี้ยังเปิดอยู่'}</span><button class="btn ghost sm" id="k-ref">🔄 โหลดใหม่</button></div>
   <nav class="tabs">${tabList().map(([k,n])=>`<button data-tab="${k}" class="${k===K.tab?'on':''}">${n}</button>`).join('')}</nav>
   <div id="k-body">${!bs.length?'<div class="note warn">ยังไม่มีคลังที่ตั้งชุด KPI</div>':({entry:entryView,daily:dailyView,sum:sumView,asg:asgView,sub:subView,close:closeView,set:setView}[K.tab]||sumView)()}</div>`;
  $('#k-out').onclick=()=>{const t=K.tok;K.tok='';try{sessionStorage.removeItem('hr_t')}catch(e){}api('logout',{t}).catch(()=>{});K.d=null;render()};
  $('#k-m').onchange=e=>load(e.target.value).catch(x=>toast(x.message));
  if($('#k-b'))$('#k-b').onchange=e=>{K.branch=e.target.value;render()};
  $('#k-ref').onclick=()=>load().then(()=>toast('โหลดข้อมูลล่าสุดแล้ว')).catch(x=>toast(x.message));
  $$('[data-tab]').forEach(b=>b.onclick=()=>{K.tab=b.dataset.tab;render()});
  ({entry:bindEntry,daily:bindDaily,asg:bindAsg,sub:bindSub,close:bindClose,set:bindSet}[K.tab]||(()=>{}))();
  $$('[data-img]').forEach(b=>b.onclick=async()=>{try{const u=await api('kpiImg',{id:b.dataset.img});const lb=$('#lb');lb.innerHTML=`<img src="${u}" alt="หลักฐาน">`;lb.hidden=false;lb.onclick=()=>lb.hidden=true}catch(e){toast(e.message)}});
}

// ---------- เข้าสู่ระบบ ----------
function loginView(){return `<div class="login panel"><h2 style="margin-top:0">เข้าสู่ระบบ KPI</h2>
 <div class="tabs"><button data-lm="bo" class="${K.lm==='bo'?'on':''}">SPV / RM / หลังบ้าน</button><button data-lm="emp" class="${K.lm==='emp'?'on':''}">ธุรการ (ADMIN)</button></div>
 ${K.lm==='bo'?`<label class="f">ชื่อผู้ใช้ (อีเมล)<input id="l-u" autocomplete="username"></label><label class="f">รหัสผ่าน<input id="l-p" type="password" autocomplete="current-password"></label><label class="f" id="l-nw" hidden>ตั้งรหัสผ่านใหม่ (อย่างน้อย 8 ตัว)<input id="l-n" type="password"></label>`
 :`<label class="f">เลขบัตรประชาชน<input id="l-id" inputmode="numeric" maxlength="17"></label><label class="f">เบอร์โทรศัพท์<input id="l-ph" inputmode="tel"></label><label class="f">PIN 6 หลัก<input id="l-pin" type="password" inputmode="numeric" maxlength="6"></label><label class="f" id="l-nw" hidden>ตั้ง PIN ใหม่ 6 หลัก<input id="l-n" type="password" inputmode="numeric" maxlength="6"></label>`}
 <div class="row" style="margin-top:10px"><button class="btn" id="l-go">เข้าสู่ระบบ</button><span class="muted sm" id="l-msg"></span></div>
 <p class="muted sm">ใช้ชื่อผู้ใช้/รหัสผ่าน หรือ เลขบัตร/เบอร์/PIN ชุดเดียวกับระบบพนักงาน</p></div>`}
function bindLogin(){$$('[data-lm]').forEach(b=>b.onclick=()=>{K.lm=b.dataset.lm;render()});
  const go=async()=>{const m=t=>$('#l-msg').textContent=t;m('กำลังตรวจสอบ…');try{let r;
    if(K.lm==='bo'){r=await api('loginBo',{user:$('#l-u').value,pass:$('#l-p').value,newPass:$('#l-n').value||undefined});if(r.mustChange){$('#l-nw').hidden=false;m('ตั้งรหัสผ่านใหม่ก่อนใช้งาน');return}}
    else{r=await api('loginEmp',{idCard:$('#l-id').value.replace(/\D/g,''),phone:$('#l-ph').value.trim(),pin:$('#l-pin').value,newPin:$('#l-n').value||undefined});if(r.needPin){$('#l-nw').hidden=false;m('ตั้ง PIN ก่อนใช้งาน');return}}
    K.tok=r.token;try{sessionStorage.setItem('hr_t',r.token)}catch(e){}await load()}catch(e){m(e.message)}};
  $('#l-go').onclick=go;$$('#app input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()})}

// ---------- กรอกผลรายวัน ----------
function canEditK(k){const kd=kind();if(k.src)return false;if(['admin','hr','spv'].includes(kd))return true;if(kd==='adm')return !k.spvOnly&&((K.d.branches[K.branch].asg[k.id]||[]).includes(K.d.me.emp));return false}
function entryView(){const B=K.d.branches[K.branch],st=setOf(K.branch);if(!B)return '';
  if(K.date.slice(0,7)!==K.month)K.date=K.month===K.d.today.slice(0,7)?K.d.today:K.month+'-01';
  const day=B.days[K.date]||{v:{}},ks=st.kpis.filter(k=>canEditK(k)||k.src),mine=st.kpis.filter(canEditK);
  const back=new Date(K.d.today+'T00:00:00');back.setDate(back.getDate()-(+K.d.def.editDays||3));
  const min=money()?K.month+'-01':iso(back)>K.month+'-01'?iso(back):K.month+'-01',max=K.d.today<K.month+'-'+pad(K.d.days)?K.d.today:K.month+'-'+pad(K.d.days);
  const locked=K.d.closed&&!money(),tooOld=!money()&&K.date<iso(back);
  return `<div class="panel"><div class="row"><label class="f">วันที่<input type="date" id="e-d" value="${K.date}" min="${min}" max="${max}"></label><span class="muted sm">คลัง <b>${esc(K.branch)}</b> · ${esc(st.name)} · กรอกย้อนหลังได้ ${K.d.def.editDays||3} วัน${money()?' (แอดมิน/HR แก้ได้ทุกวัน)':''}</span></div>
  ${locked?'<div class="note bad">เดือนนี้ปิดแล้ว แก้ไขไม่ได้ ติดต่อแอดมิน/HR</div>':tooOld?'<div class="note warn">วันนี้เกินเวลากรอกย้อนหลังแล้ว ให้แอดมิน/HR แก้ไขให้</div>':''}
  ${kind()==='adm'&&!mine.length?'<div class="note warn">เดือนนี้ยังไม่ได้รับมอบหมายหัวข้อ KPI · ให้ SPV ของคลังกำหนดผู้รับผิดชอบก่อน</div>':''}
  <p class="muted sm">เว้นว่าง = ยังไม่กรอก (ไม่นำมาคิด) · ใส่ 0 = ได้ 0 จริง</p>
  ${ks.map(k=>{const v=day.v[k.id],ed=canEditK(k)&&!locked&&!tooOld,s=k.agg==='late'?(v==null?null:(v>toMin(k.at||'07:00')?0:5)):(k.agg==='sum'?null:score(k,v));

const readImg=f=>new Promise(r=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.8))};im.onerror=()=>r('');im.src=u});

function dailyView(){const B=K.d.branches[K.branch],st=setOf(K.branch),dates=Object.keys(B.days).sort();

  const rows=dates.map(d=>{const x=B.days[d],dt=new Date(d+'T00:00:00'),fut=d>K.d.today,miss=!fut&&st.kpis.some(k=>!k.src&&(x.v[k.id]==null||x.v[k.id]===''));
    return `<tr${fut?' style="opacity:.45"':''}><td>${dt.getDate()} ${TH_D[dt.getDay()]}${miss?' <span title="ยังกรอกไม่ครบ" style="color:var(--bad)">●</span>':''}${(x.img||[]).length?' 🖼️':''}</td>${show.map(k=>`<td class="${dayCls(k,x.v[k.id])}">${esc(fv(k,x.v[k.id],true))}</td>`).join('')}<td style="text-align:left;white-space:normal;min-width:120px">${esc(x.note||'')}</td></tr>`}).join('');
  const sameSet=branches().filter(b=>K.d.def.branchSet[b]===K.d.def.branchSet[K.branch]);

   <div class="tbl"><table><thead><tr><th>วันที่</th>${show.map(k=>`<th>${esc(k.name)}<br><span class="muted sm">${esc(k.agg==='late'?'เวลาเข้า':k.unit)}</span></th>`).join('')}<th>หมายเหตุ</th></tr></thead><tbody>${rows}
   <tr class="sum"><td>สรุปทั้งเดือน</td>${show.map(k=>`<td>${esc(fv(k,B.sum[k.id].agg))}</td>`).join('')}<td></td></tr>
   <tr class="sum"><td>คะแนน (0–5)</td>${show.map(k=>`<td>${badge(B.sum[k.id].score)}</td>`).join('')}<td></td></tr></tbody></table></div>
   <div class="panel"><div class="row"><b>กราฟรายวัน</b><select id="d-ck">${st.kpis.map(k=>`<option value="${k.id}"${k.id===K.chartK?' selected':''}>${esc(k.name)}</option>`).join('')}</select><span class="muted sm">เทียบคลังที่ใช้ชุดเดียวกัน · เส้นประ = เป้า 5 คะแนน</span></div>${chart(st.kpis.find(k=>k.id===K.chartK),sameSet)}</div>`}
function chart(k,bs){const n=K.d.days,W=760,H=240,L=54,R=10,T=12,Bm=28,cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const ser=bs.map(b=>Object.keys(K.d.branches[b].days).sort().map(d=>{const v=K.d.branches[b].days[d].v[k.id];return v==null||v===''?null:+v}));
  const all=ser.flat().filter(v=>v!=null).concat([+k.th[0]]);if(all.length<2)return '<p class="muted">ยังไม่มีข้อมูลพอสำหรับกราฟ</p>';
  let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
  const x=i=>L+(W-L-R)*(n<2?0:i/(n-1)),y=v=>T+(H-T-Bm)*(1-(v-lo)/(hi-lo));
  const ticks=[0,.25,.5,.75,1].map(f=>lo+(hi-lo)*f);
  const lab=v=>k.time||k.agg==='late'?hm(v):(Math.abs(v)>=1000?Math.round(v).toLocaleString('th-TH'):(+v).toFixed(1));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟ ${esc(k.name)}">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${lab(t)}</text>`).join('')}
   ${[1,5,10,15,20,25,n].map(d=>`<text x="${x(d-1)}" y="${H-8}" text-anchor="middle">${d}</text>`).join('')}
   <line x1="${L}" x2="${W-R}" y1="${y(+(k.agg==='late'?toMin(k.at||'07:00'):k.th[0]))}" y2="${y(+(k.agg==='late'?toMin(k.at||'07:00'):k.th[0]))}" stroke="var(--ok)" stroke-dasharray="5 4"/>
   ${ser.map((s,j)=>{let p='',seg=[];s.forEach((v,i)=>{if(v==null){if(seg.length)p+='M'+seg.join('L');seg=[]}else seg.push(x(i).toFixed(1)+','+y(v).toFixed(1))});if(seg.length)p+='M'+seg.join('L');
     return `<path d="${p}" fill="none" stroke="${cols[j%5]}" stroke-width="2.2"/>${s.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${cols[j%5]}"><title>${esc(bs[j])} วันที่ ${i+1}: ${esc(fv(k,v,true))}</title></circle>`).join('')}`}).join('')}</svg>
   <div class="row sm">${bs.map((b,j)=>`<span><span style="display:inline-block;width:14px;height:4px;background:${cols[j%5]};vertical-align:middle"></span> ${esc(b)}</span>`).join('')}</div>`}
function bindDaily(){const q=$('#d-q');if(q){q.oninput=()=>{K.q=q.value;const p=q.selectionStart;render();const n=$('#d-q');n.focus();n.setSelectionRange(p,p)}}const c=$('#d-ck');if(c)c.onchange=()=>{K.chartK=c.value;render()}}

function subView(){const rb=K.d.def.rm.branches||[],sub=K.d.sub||{},n=K.d.days;if(K.date.slice(0,7)!==K.month)K.date=K.month===K.d.today.slice(0,7)?K.d.today:K.month+'-01';const cur=sub[K.date]||{};

   <div class="tbl" style="margin-top:8px"><table><thead><tr><th>คลัง</th><th>จำนวน (ชิ้น)</th><th>ค่าใช้จ่าย (บาท)</th></tr></thead><tbody>${rb.map(b=>`<tr><td>${esc(b)}</td><td><input data-su="${esc(b)}" inputmode="numeric" value="${cur[b]?cur[b].units:''}" style="width:110px;text-align:right"></td><td><input data-sb="${esc(b)}" inputmode="decimal" value="${cur[b]?cur[b].baht:''}" style="width:130px;text-align:right"></td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:8px"><button class="btn" id="s-save">บันทึกวันที่ ${dLabel(K.date)}</button><button class="btn ghost" id="s-zero">ไม่ได้ใช้ซัพ (0 ทุกคลัง)</button></div></div>
   <div class="tbl"><table><thead><tr><th>วันที่</th>${rb.map(b=>`<th>${esc(b)} ชิ้น</th><th>${esc(b)} บาท</th>`).join('')}</tr></thead><tbody>${rows.join('')}<tr class="sum"><td>รวม</td><td colspan="${rb.length*2}">${tu.toLocaleString()} ชิ้น · ${baht(tb)}</td></tr></tbody></table></div>`}
function bindSub(){const d=$('#s-d');if(!d)return;d.onchange=()=>{if(d.value){K.date=d.value;if(d.value.slice(0,7)!==K.month)load(d.value.slice(0,7)).catch(e=>toast(e.message));else render()}};
  const save=async zero=>{const v={};(K.d.def.rm.branches||[]).forEach(b=>{v[b]={units:zero?0:$(`[data-su="${b}"]`).value,baht:zero?0:$(`[data-sb="${b}"]`).value}});try{await api('kpiSub',{date:K.date,v});await load();toast('บันทึกแล้ว')}catch(e){toast(e.message)}};
  $('#s-save').onclick=()=>save(false);$('#s-zero').onclick=()=>save(true)}

// ---------- ปิดเดือน / พิมพ์ (แอดมิน/HR) ----------
function payRows(){const out=[];branches().forEach(b=>K.d.branches[b].people.forEach(p=>out.push({b,name:p.name,pos:p.pos==='ADMIN'?'ธุรการ (ADMIN)':'SPV',pct:p.pct,p1:p.p1,p2:p.p2,total:p.total})));
  if(K.d.rm)out.push({b:'RM',name:'RM',pos:'RM',pct:K.d.rm.pct,p1:K.d.rm.p1,p2:K.d.rm.p2,total:K.d.rm.total});return out}
function closeView(){const r=payRows(),tot=r.reduce((a,x)=>a+(+x.total||0),0);
  return `<div class="panel noprint"><b>${mLabel(K.month)} · ${K.d.closed?'🔒 ปิดเดือนแล้ว':'ยังเปิดอยู่'}</b>
   <p class="muted sm">ปิดเดือน = ล็อกไม่ให้ SPV/ธุรการแก้ผล และเก็บเกณฑ์ ณ วันปิดไว้ (แก้หัวข้อทีหลังไม่กระทบเดือนที่ปิดแล้ว)</p>
   <div class="row">${K.d.closed?(kind()==='admin'?'<button class="btn ghost" id="c-open">เปิดเดือนให้แก้ไขอีกครั้ง</button>':''):'<button class="btn" id="c-close">ปิดเดือนนี้</button>'}<button class="btn ghost" id="c-print">🖨️ พิมพ์ใบสรุปเงิน KPI</button><button class="btn ghost" id="c-csv">⬇️ ดาวน์โหลด CSV</button></div></div>
   <div class="panel" id="c-doc"><h2 style="margin-top:0">สรุปเงินรางวัล KPI ประจำเดือน ${mLabel(K.month)}</h2><p class="muted sm">บริษัท พราวเอ็กซ์เพรส จำกัด · ${K.d.closed?'ปิดเดือนแล้ว':'ยังไม่ปิดเดือน (ตัวเลขอาจเปลี่ยน)'}</p>
   <div class="tbl" style="max-height:none"><table><thead><tr><th>คลัง</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>คะแนน</th><th>ก้อนขั้นบันได</th><th>โบนัส</th><th>รวม</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.b)}</td><td>${esc(x.name)}</td><td>${esc(x.pos)}</td><td>${x.pct==null?'–':(+x.pct).toFixed(2)+'%'}</td><td>${baht(x.p1)}</td><td>${baht(x.p2)}</td><td class="money">${baht(x.total)}</td></tr>`).join('')}
   <tr class="sum"><td colspan="6">รวมทั้งสิ้น</td><td>${baht(tot)}</td></tr></tbody></table></div>
   <div class="row" style="justify-content:space-around;margin-top:46px;text-align:center">${['ผู้จัดทำ','ผู้ตรวจสอบ','ผู้อนุมัติ'].map(t=>`<div>ลงชื่อ ...............................<br>(...............................)<br>${t}</div>`).join('')}</div></div>`}
function bindClose(){const c=$('#c-close'),o=$('#c-open');
  if(c)c.onclick=async()=>{if(c.dataset.sure!=='1'){c.dataset.sure='1';c.textContent='กดอีกครั้งเพื่อยืนยันปิดเดือน';return}try{await api('kpiClose',{month:K.month});await load();toast('ปิดเดือนแล้ว')}catch(e){toast(e.message)}};
  if(o)o.onclick=async()=>{try{await api('kpiClose',{month:K.month,open:true});await load();toast('เปิดเดือนแล้ว')}catch(e){toast(e.message)}};
  $('#c-print').onclick=()=>{api('log',{detail:'KPI พิมพ์สรุป '+K.month}).catch(()=>{});window.print()};
  $('#c-csv').onclick=async()=>{try{await api('log',{detail:'KPI CSV '+K.month})}catch(e){toast(e.message);return}
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',lines=[['คลัง','ชื่อ','ตำแหน่ง','คะแนน%','ก้อนขั้นบันได','โบนัส','รวม'].map(q).join(',')].concat(payRows().map(x=>[x.b,x.name,x.pos,x.pct,x.p1,x.p2,x.total].map(q).join(',')));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}));a.download='KPI_'+K.month+'.csv';a.click()}}

// ---------- ตั้งค่าหัวข้อ (แอดมิน) ----------
function setView(){if(!K.defEdit)K.defEdit=JSON.parse(JSON.stringify(K.d.def));const D=K.defEdit,names=Object.keys(D.sets);if(!D.sets[K.set])K.set=names[0];const st=D.sets[K.set],ws=st.kpis.reduce((a,k)=>a+(+k.w||1),0);
  const top=Math.max(0,...st.ladder.map(r=>+r[1]||0)),mx=top+(+st.bonusTotal||0);
  return `<div class="note">แก้แล้วกด <b>บันทึกการตั้งค่า</b> ด้านล่าง · มีผลกับเดือนที่ยังไม่ปิดทันที (เดือนที่ปิดแล้วใช้เกณฑ์ ณ วันปิด) · เพิ่ม/ลดหัวข้อได้ ระบบแบ่งสัดส่วนคะแนนและโบนัสตามน้ำหนักให้เอง</div>
  <div class="row"><label class="f">ชุด KPI<select id="t-set">${names.map(n=>`<option value="${esc(n)}"${n===K.set?' selected':''}>${esc(D.sets[n].name)} (${esc(n)})</option>`).join('')}</select></label><label class="f">ชื่อชุด<input id="t-sn" value="${esc(st.name)}"></label><button class="btn ghost sm" id="t-addset">+ เพิ่มชุดใหม่</button></div>
  <h3>หัวข้อ (${st.kpis.length})</h3><div class="tbl" style="max-height:none"><table class="set"><thead><tr><th>#</th><th>ชื่อหัวข้อ</th><th>หน่วย</th><th>ทิศทาง</th><th>สรุปเดือน</th><th>5 คะแนน</th><th>4</th><th>3</th><th>2</th><th>1</th><th>น้ำหนัก</th><th>สัดส่วน</th><th>ช่องย่อย (คั่นด้วย ,)</th><th></th></tr></thead><tbody>
  ${st.kpis.map((k,i)=>`<tr><td>${i+1}</td><td><input class="nm" data-f="name" data-i="${i}" value="${esc(k.name)}"></td><td><input class="u" data-f="unit" data-i="${i}" value="${esc(k.unit)}"${k.src?' disabled':''}></td>
   <td><select data-f="dir" data-i="${i}"${k.src?' disabled':''}><option value="hi"${k.dir==='hi'?' selected':''}>มากยิ่งดี ≥</option><option value="lo"${k.dir==='lo'?' selected':''}>น้อยยิ่งดี ≤</option></select></td>
   <td>${k.src?'สาย (ครั้ง) · เวลา <input data-f="at" data-i="'+i+'" value="'+esc(k.at||'07:00')+'" style="width:60px">':`<select data-f="agg" data-i="${i}"><option value="avg"${k.agg==='avg'?' selected':''}>เฉลี่ย</option><option value="sum"${k.agg==='sum'?' selected':''}>รวม</option><option value="max"${k.agg==='max'?' selected':''}>แย่สุด</option></select>`}${k.src?'':`<label class="sm"><input type="checkbox" data-f="time" data-i="${i}"${k.time?' checked':''}> เวลา</label>`}</td>
   ${k.th.map((t,j)=>`<td><input data-th="${j}" data-i="${i}" value="${k.time?hm(t):esc(t)}"></td>`).join('')}
   <td><input data-f="w" data-i="${i}" value="${esc(k.w||1)}" style="width:50px"></td><td>${((+k.w||1)/ws*100).toFixed(1)}%</td>
   <td><input data-f="parts" data-i="${i}" value="${esc((k.parts||[]).join(', '))}" style="width:150px"${k.src?' disabled':''}></td>
   <td><button class="btn ghost sm" data-up="${i}" title="เลื่อนขึ้น">↑</button><button class="btn ghost sm" data-del="${i}">ลบ</button></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:6px"><button class="btn ghost sm" id="t-add">+ เพิ่มหัวข้อ</button>${st.kpis.some(k=>k.src)?'':'<button class="btn ghost sm" id="t-addat">+ เพิ่มหัวข้อ SPV เข้างานตรงเวลา</button>'}<span class="muted sm">เกณฑ์ 4–2 ปล่อยว่างแล้วกด "ไล่ระดับ" ระบบเติมให้เท่าๆ กัน</span><button class="btn ghost sm" id="t-fill">ไล่ระดับเกณฑ์ 4–2</button></div>
  <h3>เงินรางวัลของชุดนี้</h3><div class="row"><label class="f">เงินโบนัสหัวข้อเต็มรวม (บาท)<input id="t-bt" value="${esc(st.bonusTotal)}"></label><span class="muted sm">= หัวข้อละ ${baht((+st.bonusTotal||0)/ws)} (ถ้าน้ำหนักเท่ากัน) · เพดานรวม ${baht(mx)}</span></div>
  <div class="tbl" style="max-height:none;margin-top:6px"><table class="set"><thead><tr><th>ตั้งแต่ % ของคะแนนเต็ม</th><th>ได้เงินก้อนขั้นบันได (บาท)</th><th></th></tr></thead><tbody>${st.ladder.map((r,i)=>`<tr><td><input data-lp="${i}" value="${esc(r[0])}"></td><td><input data-lb="${i}" value="${esc(r[1])}" style="width:110px"></td><td><button class="btn ghost sm" data-ldel="${i}">ลบ</button></td></tr>`).join('')}</tbody></table></div><button class="btn ghost sm" id="t-ladd" style="margin-top:6px">+ เพิ่มขั้น</button>
  <h3>คลังใช้ชุดไหน</h3><div class="row">${Object.keys(D.branchSet).map(b=>`<label class="f">คลัง ${esc(b)}<select data-bs="${esc(b)}">${names.map(n=>`<option${D.branchSet[b]===n?' selected':''}>${esc(n)}</option>`).join('')}<option value="">— ไม่ใช้ KPI —</option></select></label>`).join('')}<label class="f">เพิ่มคลัง<input id="t-nb" placeholder="รหัสคลัง" style="width:110px"></label></div>
  <h3>ธุรการ / RM / อื่นๆ</h3><div class="row"><label class="f">เพดานเงิน KPI ธุรการ (ADMIN) ต่อเดือน<input id="t-am" value="${esc(D.adminMax)}"></label><label class="f">RM ก้อนที่ 1 (ตามคะแนนเฉลี่ย)<input id="t-r1" value="${esc(D.rm.pool1)}"></label><label class="f">RM ก้อนที่ 2 (ไม่ใช้ซัพทั้งเดือน)<input id="t-r2" value="${esc(D.rm.pool2)}"></label><label class="f">กรอกย้อนหลังได้ (วัน)<input id="t-ed" value="${esc(D.editDays)}"></label></div>
  <div class="row" style="margin-top:6px"><span class="muted sm">RM เฉลี่ยจากคลัง:</span>${Object.keys(D.branchSet).map(b=>`<label class="sm"><input type="checkbox" data-rb="${esc(b)}"${(D.rm.branches||[]).includes(b)?' checked':''}> ${esc(b)}</label>`).join('')}</div>
  <div class="row" style="margin:16px 0"><button class="btn" id="t-save">บันทึกการตั้งค่า</button><button class="btn ghost" id="t-reset">ยกเลิกที่แก้</button></div>`}
function readSet(){const D=K.defEdit,st=D.sets[K.set];if(!st)return;const num=v=>{v=String(v).trim().replace(/,/g,'');return v===''?'':+v};
  const sn=$('#t-sn');if(sn)st.name=sn.value.trim()||st.name;
  $$('[data-f]').forEach(el=>{const k=st.kpis[+el.dataset.i],f=el.dataset.f;if(!k)return;if(f==='time')k.time=el.checked;else if(f==='parts'){const p=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(p.length)k.parts=p;else delete k.parts}else if(f==='w')k.w=+el.value||1;else k[f]=el.value.trim()});
  $$('[data-th]').forEach(el=>{const k=st.kpis[+el.dataset.i];const v=el.value.trim();k.th[+el.dataset.th]=k.time?(toMin(v)==null?'':(toMin(v)<360?toMin(v)+1440:toMin(v))):num(v)});
  $$('[data-lp]').forEach(el=>{st.ladder[+el.dataset.lp][0]=+num(el.value)||0});$$('[data-lb]').forEach(el=>{st.ladder[+el.dataset.lb][1]=+num(el.value)||0});
  if($('#t-bt'))st.bonusTotal=+num($('#t-bt').value)||0;
  $$('[data-bs]').forEach(el=>{if(el.value)D.branchSet[el.dataset.bs]=el.value;else delete D.branchSet[el.dataset.bs]});
  const nb=$('#t-nb');if(nb&&nb.value.trim())D.branchSet[nb.value.trim()]=K.set;
  if($('#t-am'))D.adminMax=+num($('#t-am').value)||0;if($('#t-r1'))D.rm.pool1=+num($('#t-r1').value)||0;if($('#t-r2'))D.rm.pool2=+num($('#t-r2').value)||0;if($('#t-ed'))D.editDays=Math.max(0,+num($('#t-ed').value)||0);
  if($$('[data-rb]').length)D.rm.branches=$$('[data-rb]').filter(c=>c.checked).map(c=>c.dataset.rb)}
function bindSet(){const D=K.defEdit,re=()=>{readSet();render()},st=()=>D.sets[K.set];
  $('#t-set').onchange=e=>{readSet();K.set=e.target.value;render()};
  $('#t-addset').onclick=()=>{readSet();let i=1;while(D.sets['SET'+i])i++;D.sets['SET'+i]={name:'ชุดใหม่ '+i,bonusTotal:0,ladder:[[100,0],[0,0]],kpis:[{id:'k'+Date.now().toString(36),name:'หัวข้อใหม่',unit:'%',dir:'hi',th:[100,'','','',90],agg:'avg'}]};K.set='SET'+i;render()};
  $('#t-add').onclick=()=>{readSet();st().kpis.push({id:'k'+Date.now().toString(36),name:'หัวข้อใหม่',unit:'%',dir:'hi',th:['','','','',''],agg:'avg'});render()};
  if($('#t-addat'))$('#t-addat').onclick=()=>{readSet();st().kpis.push({id:'at'+Date.now().toString(36),name:'SPV เข้างานตรงเวลา 07:00 น. (จากการลงเวลา)',unit:'ครั้งที่สาย',dir:'lo',th:[0,1,2,3,4],agg:'late',src:'punch',at:'07:00',spvOnly:true});render()};
  $('#t-fill').onclick=()=>{readSet();st().kpis.forEach(k=>{const a=+k.th[0],b=+k.th[4];if(k.th[0]===''||k.th[4]===''||isNaN(a)||isNaN(b))return;for(let j=1;j<4;j++)if(k.th[j]===''||k.th[j]==null)k.th[j]=Math.round((a+(b-a)*j/4)*100)/100});render()};
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='ยืนยันลบ';return}readSet();if(st().kpis.length<2){toast('ต้องมีอย่างน้อย 1 หัวข้อ');return}st().kpis.splice(+b.dataset.del,1);render()});
  $$('[data-up]').forEach(b=>b.onclick=()=>{readSet();const i=+b.dataset.up;if(i>0){const a=st().kpis;[a[i-1],a[i]]=[a[i],a[i-1]]}render()});
  $$('[data-ldel]').forEach(b=>b.onclick=()=>{readSet();st().ladder.splice(+b.dataset.ldel,1);render()});
  $('#t-ladd').onclick=()=>{readSet();st().ladder.push([0,0]);render()};
  $('#t-reset').onclick=()=>{K.defEdit=null;render()};
  $('#t-save').onclick=async()=>{readSet();for(const s of Object.values(D.sets))for(const k of s.kpis){if(!k.name){toast('มีหัวข้อที่ไม่มีชื่อ');return}if(k.th.some(t=>t===''||t==null||isNaN(t))){toast('"'+k.name+'" ใส่เกณฑ์ไม่ครบ 5 ระดับ (กด "ไล่ระดับ" ช่วยได้)');return}}
    try{await api('kpiSetDef',{def:D});K.defEdit=null;await load();toast('บันทึกการตั้งค่าแล้ว')}catch(e){toast(e.message)}}}

(async()=>{if(K.tok){try{await load()}catch(e){K.d=null;render()}}else render()})();
</script></body></html>
