<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>KPI พราวเอ็กซ์เพรส</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f3f2;--surface:#fff;--line:#e4dcda;--fg:#1f1716;--muted:#6d5f5c;--brand:#b0141f;--brand-ink:#fff;--brand-soft:#f7e3e4;
--ok:#1d7a46;--ok-soft:#e1f3e8;--warn:#9a6200;--warn-soft:#fbefd6;--bad:#b0141f;--bad-soft:#f7e3e4;--mid:#3c6fb0;--mid-soft:#e3ecf7;
--f-display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;--f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;--r:10px;
--c1:#2a6fdb;--c2:#e07b00;--c3:#1d9a5b;--c4:#c2185b;--c5:#6a4fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171212;--surface:#211a19;--line:#3a2f2d;--fg:#f2eceb;--muted:#b3a5a2;--brand:#d8343f;--brand-soft:#3a1d1f;
--ok:#5cc58a;--ok-soft:#18301f;--warn:#e3a94a;--warn-soft:#352914;--bad:#ef6b72;--bad-soft:#3a1d1f;--mid:#7fa7e0;--mid-soft:#1c2636;--c1:#6ea2f5;--c2:#f2a446;--c3:#5cc58a;--c4:#f06292;--c5:#a58be0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171212;--surface:#211a19;--line:#3a2f2d;--fg:#f2eceb;--muted:#b3a5a2;--brand:#d8343f;--brand-soft:#3a1d1f;--ok:#5cc58a;--ok-soft:#18301f;--warn:#e3a94a;--warn-soft:#352914;--bad:#ef6b72;--bad-soft:#3a1d1f;--mid:#7fa7e0;--mid-soft:#1c2636;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 1.1rem var(--f-display);line-height:1.2}.logo small{display:block;font-weight:500;font-size:.78rem;opacity:.85}
.who{margin-left:auto;font-size:.88rem;opacity:.95;text-align:right}
h2{font:700 1.15rem var(--f-display);margin:18px 0 8px}h3{font:600 1rem var(--f-display);margin:14px 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--brand);color:var(--brand-ink);font:600 .95rem var(--f-display);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
header .btn.ghost{color:var(--brand-ink);border-color:rgba(255,255,255,.5)}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}label.f>*{color:var(--fg)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-display);padding:8px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:.86rem}
.note{padding:9px 12px;border-radius:8px;background:var(--mid-soft);margin:8px 0;font-size:.92rem}.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.ok{background:var(--ok-soft)}
.kin{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kin:last-child{border-bottom:0}.kin .nm{font-weight:600}.kin .tg{font-size:.84rem;color:var(--muted)}
.kin input{width:140px;text-align:right}.kin .parts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kin .parts label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column}.kin .parts input{width:90px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right;white-space:nowrap}td[style*="text-align:left"],td:first-child{white-space:normal}
th{position:sticky;top:0;background:var(--surface);font-family:var(--f-display);font-weight:600;z-index:1;text-align:center;white-space:normal;min-width:50px;font-size:.8rem}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
tr.sum td{font-weight:700;background:var(--mid-soft)}tr.sum td:first-child{background:var(--mid-soft)}
.s5,.s4{background:var(--ok-soft)}.s3,.s2{background:var(--warn-soft)}.s1,.s0{background:var(--bad-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.seg button{border:1.5px solid var(--line);background:var(--card,transparent);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--brand,#b0141f);border-color:var(--brand,#b0141f);color:#fff}
.tabs.sub{margin-top:4px}.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);z-index:5}.nowrap{white-space:nowrap}table.st2 td{padding:4px 5px}table.st2 input.nm{min-width:0;width:100%}table.st2 td:nth-child(2){min-width:220px}table.st2 select{max-width:140px}
@media (max-width:760px){.tbl.cards{border:0;background:none;max-height:none;overflow:visible}.tbl.cards table,.tbl.cards thead,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:auto}.tbl.cards thead{display:none}
 .tbl.cards tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 12px;background:var(--surface)}.tbl.cards td{border:0;padding:4px 0 4px 40%;position:relative;text-align:left;white-space:normal;min-height:1.5em}
 .tbl.cards td::before{content:attr(data-l);position:absolute;left:0;top:5px;width:37%;color:var(--muted);font-size:.78rem;font-weight:400;line-height:1.3}.tbl.cards td.nol{padding-left:0}.tbl.cards td.nol::before{display:none}.tbl.cards td:empty{display:none}}
.badge{display:inline-block;min-width:26px;padding:1px 7px;border-radius:999px;font-weight:700;text-align:center;font-size:.85rem}
.badge.s5,.badge.s4{color:var(--ok)}.badge.s3,.badge.s2{color:var(--warn)}.badge.s1,.badge.s0{color:var(--bad)}.badge.na{background:var(--line);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.big{font:700 2rem var(--f-display);line-height:1.1}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--brand)}
.money{color:var(--ok);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.82rem;color:var(--fg)}
.thumbs img{max-width:100%;max-height:60vh;display:block}
.mx td,.mx th{text-align:center}.mx td:first-child{text-align:left;white-space:normal;min-width:180px}
.set td{padding:3px}.set input{width:76px}.set input.nm{width:230px}.set input.u{width:70px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#lb img{max-width:100%;max-height:90vh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;max-width:90vw;font-size:.92rem}
.login{max-width:420px;margin:30px auto}
svg text{fill:var(--muted);font:12px var(--f-body)}
@media (max-width:600px){.kin{grid-template-columns:1fr}.kin input{width:100%}.kin .parts{justify-content:flex-start}.who{margin-left:0;text-align:left}}
@media print{header,.tabs,.noprint{display:none!important}body{background:#fff;color:#000}.panel{border:0}}
</style></head><body>
<header class="top"><div class="wrap"><div class="logo">KPI คลังสินค้า<small>บริษัท พราวเอ็กซ์เพรส จำกัด</small></div><div class="who" id="who"></div></div></header>
<main class="wrap" id="app"><p class="muted">กำลังโหลด…</p></main>
<div id="toast" hidden></div><div id="lb" hidden></div>
<script>
// ===== ใส่ URL ของ Apps Script (ตัวเดียวกับไฟล์ index.html) ระหว่างเครื่องหมาย ' ' =====
const API_URL='https://script.google.com/macros/s/AKfycbw2Gf7NX4huSWPWLx257MhUwB2EHxhowh0ugVg61_rAaLufeJaAUrvmRqJLkBFLFUFA/exec';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={tok:'',d:null,month:'',branch:'',tab:'',date:'',set:'',defEdit:null,lm:'bo',busy:false,chartK:''};
try{K.tok=sessionStorage.getItem('hr_t')||''}catch(e){}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3500)}
async function api(a,p){let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({a,t:K.tok},p||{}))})}catch(e){throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ต')}
  const j=await r.json();if(!j.ok){if(j.error==='SESSION_EXPIRED'){K.tok='';try{sessionStorage.removeItem('hr_t')}catch(e){}K.d=null;render();throw new Error('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าใหม่')}throw new Error(j.error)}return j.r}
const pad=n=>('0'+n).slice(-2),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const mLabel=m=>{const[y,mo]=m.split('-');return TH_M[+mo-1]+' '+(+y+543)};
const dLabel=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)};
const money=()=>K.d&&['admin','hr'].includes(K.d.me.role);
const kind=()=>K.d&&K.d.who.kind;const solo=()=>kind()==='adm'&&K.d.who.pos!=='CRD';   // ธุรการ เห็นเฉพาะหัวข้อตัวเอง   // admin hr rm spv adm
const setOf=b=>K.d.def.sets[K.d.def.branchSet[b]];
const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(Math.round(m%60))};
const hasTg=k=>k&&k.tg!==''&&k.tg!=null&&!isNaN(k.tg);
const scored=k=>hasTg(k)&&!k.rmOnly&&!k.info&&(k.w==null||+k.w>0);
const kW=k=>k.w==null||k.w===''?1:+k.w;
function fv(k,v,daily){if(v==null||v==='')return '';if(k.time||(daily&&k.agg==='late'))return hm(v);if(k.agg==='late')return v+' ครั้ง';if(k.unit==='%')return (+v).toFixed(2)+'%';return (+v).toLocaleString('th-TH',{maximumFractionDigits:2})+(k.unit&&k.unit!=='เวลา'?' '+k.unit:'')}
const tgTxt=k=>{if(!hasTg(k))return k.rmOnly?'ใช้ประเมิน RM':'ข้อมูลประกอบ (ไม่คิดคะแนน)';if(k.agg==='late')return 'เข้างานไม่เกิน '+(k.at||'07:00')+' น. · สายได้ไม่เกิน '+(+k.tg)+' ครั้ง/เดือน';return (k.dir==='hi'?'≥ ':'≤ ')+(k.time?hm(+k.tg)+' น.':fv(k,+k.tg))};
const target=k=>tgTxt(k)+(hasTg(k)&&k.agg!=='late'?(k.agg==='sum'?' (รวมทั้งเดือน)':' (เฉลี่ยทั้งเดือน)'):'');
function score(k,v){if(v==null||v===''||isNaN(v)||!hasTg(k))return null;return (k.dir==='hi'?+v>=+k.tg:+v<=+k.tg)?5:0}
function dayCls(k,v){if(v==null||v==='')return '';if(k.agg==='late'){return v>toMin(k.at||'07:00')?'s0':'s5'}if(k.agg==='sum'||!hasTg(k))return '';const s=score(k,v);return s==null?'':'s'+s}
const toMin=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const badge=s=>s==null?'<span class="badge na">–</span>':s>=5?'<span class="badge s5">✓ ผ่าน</span>':'<span class="badge s0">✗ ไม่ผ่าน</span>';
const baht=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})+' บาท';
const thisMonth=()=>iso(new Date()).slice(0,7);
const branches=()=>Object.keys(K.d.branches);
const POSN={SPV:'SPV',ADMIN:'ธุรการ (ADMIN)',CRD:'ผู้ช่วยหัวหน้าคลัง (CRD)',RM:'RM'};const posN=p=>POSN[p]||p;
const progOn=()=>!!(K.d&&K.d.def.program&&K.d.def.program.from&&K.month>=K.d.def.program.from);
const cfgOf=b=>((K.d.def.program||{}).bySet||{})[K.d.def.branchSet[b]]||{};
const isCrash=(b,d,v)=>{const C=cfgOf(b);if(!C.crashK||v==null||v==='')return false;if(C.crashMode==='time'){let a=toMin(C.crashAfter||'20:00');if(a<360)a+=1440;return +v>a}const w=new Date(d+'T00:00:00').getDay();return +v<=((w===0||w===6)?+C.crashWe:+C.crashWd)};
const crashNm=b=>cfgOf(b).crashName||'คลังแตก';
function condTxt(p){const o=[];if(p.inProgram===false)o.push('<span class="badge s0">ยังไม่มีสัญญาโครงการ</span>');if(p.volAvg!=null&&p.pos==='SPV')o.push('ยอดเฉลี่ย '+(+p.volAvg).toLocaleString()+' ชิ้น/วัน → ขั้น '+p.tier);else if(p.pos==='SPV'&&p.tier)o.push('ยังไม่มียอดพัสดุ → ขั้น 1');if(p.crashDays)o.push((p.crashName||'คลังแตก')+' '+p.crashDays+' วัน');if(p.subUsed&&p.pos!=='ADMIN')o.push('ใช้ซัพ');if(p.failTopics!=null)o.push('ไม่ผ่าน '+p.failTopics+'/'+p.nScored+' หัวข้อ');if(p.failMonths)o.push('<span class="badge '+(p.demote?'s0':'s2')+'">ไม่ผ่าน KPI ติดกัน '+p.failMonths+' เดือน'+(p.demote?' → พิจารณาปรับลดตำแหน่ง':'')+'</span>');if(p.failDays!=null)o.push('ไม่ผ่าน '+p.failDays+' วัน (ติดกันสูงสุด '+p.streak+')');if(p.out)o.push('<span class="badge s0">ไม่ผ่านติดกัน '+((cfgOf(K.branch).ADMIN||{}).outDays||30)+' วัน → ออกจากการประเมิน KPI</span>');if(p.factor!=null&&p.factor<1&&p.inProgram)o.push('คิดตามสัดส่วนวัน '+Math.round(p.factor*100)+'%');if(p.noMoney)o.push(esc(p.noMoney));return o.join(' · ')||'-'}
const dedTxt=p=>(p.ded||[]).length?p.ded.map(d=>esc(d[0])+' <b>'+baht(d[1])+'</b>').join('<br>'):'-';

async function load(m){K.busy=true;try{K.d=await api('kpiLoad',{month:m||K.month||thisMonth()});K.month=K.d.month;if(!K.branch||!K.d.branches[K.branch])K.branch=branches()[0]||'';if(!K.date)K.date=K.d.today;
  const tabs=tabList().map(t=>t[0]);if(!tabs.includes(K.tab))K.tab=tabs[0]}finally{K.busy=false}render()}
function tabList(){const k=kind(),t=[];if(k!=='rm')t.push(['entry','📝 กรอกผลรายวัน']);t.push(['daily','📅 ผลรายวัน'],['sum','🏆 สรุปคะแนน']);
  if(['spv','admin','hr','rm'].includes(k)||(k==='adm'&&!solo()))t.push(['asg','👥 ผู้รับผิดชอบ']);
  if(money())t.push(['close','🧾 ปิดเดือน / พิมพ์'],['imp','📥 นำเข้าหลายวัน']);if(k==='admin')t.push(['set','⚙️ ตั้งค่าหัวข้อ']);return t}

function cardify(){$$('.tbl table').forEach(t=>{if(t.classList.contains('set')||t.classList.contains('mx'))return;const th=t.tHead&&t.tHead.rows[0];if(!th)return;const lab=[];[...th.cells].forEach(c=>{for(let i=0;i<(c.colSpan||1);i++)lab.push(c.textContent.trim())});if(lab.length>12)return;
  [...t.tBodies].forEach(b=>[...b.rows].forEach(r=>{let i=0;[...r.cells].forEach(c=>{const sp=c.colSpan||1;if(sp>1||!lab[i])c.classList.add('nol');else c.dataset.l=lab[i];i+=sp})}));t.closest('.tbl').classList.add('cards')})}
function render(){const app=$('#app');
  if(!K.d){$('#who').innerHTML='';app.innerHTML=loginView();bindLogin();return}
  const me=K.d.me,RN={admin:'แอดมิน',hr:'HR',rm:'RM',spv:'SPV',emp:'ธุรการ (ADMIN)'};
  $('#who').innerHTML=`<b>${esc(me.name)}</b> · ${RN[me.role]||me.role}${K.d.who.branch?' คลัง '+esc(K.d.who.branch):''}<br><button class="btn ghost sm" id="k-out">ออกจากระบบ</button> <a class="btn ghost sm" href="./" style="text-decoration:none">ระบบพนักงาน</a>`;
  const ms=[];{const d=new Date();d.setDate(1);for(let i=0;i<13;i++){ms.push(iso(d).slice(0,7));d.setMonth(d.getMonth()-1)}}if(!ms.includes(K.month))ms.push(K.month);
  const bs=branches();
  {const tl=tabList().map(t=>t[0]);if(!tl.includes(K.tab))K.tab=tl[0]}
  app.innerHTML=`<div class="row noprint" style="margin-top:12px"><label class="f">เดือน<select id="k-m">${ms.map(m=>`<option value="${m}"${m===K.month?' selected':''}>${mLabel(m)}</option>`).join('')}</select></label>
   ${bs.length>1?`<label class="f">คลัง<select id="k-b">${bs.map(b=>`<option${b===K.branch?' selected':''}>${esc(b)}</option>`).join('')}</select></label>`:''}
   <span class="muted sm" style="margin-left:auto">${K.d.closed?'🔒 เดือนนี้ปิดแล้ว':'เดือนนี้ยังเปิดอยู่'}</span><button class="btn ghost sm" id="k-ref">🔄 โหลดใหม่</button></div>
   <nav class="tabs">${tabList().map(([k,n])=>`<button data-tab="${k}" class="${k===K.tab?'on':''}">${n}</button>`).join('')}</nav>
   <div id="k-body">${!bs.length?'<div class="note warn">ยังไม่มีคลังที่ตั้งชุด KPI</div>':({entry:entryView,daily:dailyView,sum:sumView,asg:asgView,sub:subView,close:closeView,set:setView,imp:impView}[K.tab]||sumView)()}</div>`;
  $('#k-out').onclick=()=>{const t=K.tok;K.tok='';try{sessionStorage.removeItem('hr_t')}catch(e){}api('logout',{t}).catch(()=>{});K.d=null;render()};
  $('#k-m').onchange=e=>load(e.target.value).catch(x=>toast(x.message));
  if($('#k-b'))$('#k-b').onchange=e=>{K.branch=e.target.value;render()};
  $('#k-ref').onclick=()=>load().then(()=>toast('โหลดข้อมูลล่าสุดแล้ว')).catch(x=>toast(x.message));
  $$('[data-tab]').forEach(b=>b.onclick=()=>{K.tab=b.dataset.tab;render()});
  ({entry:bindEntry,daily:bindDaily,asg:bindAsg,sub:bindSub,close:bindClose,set:bindSet,imp:bindImp}[K.tab]||(()=>{}))();cardify();

function chart(k,bs){const n=K.d.days,W=760,H=240,L=54,R=10,T=12,Bm=28,cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];

  let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
  const x=i=>L+(W-L-R)*(n<2?0:i/(n-1)),y=v=>T+(H-T-Bm)*(1-(v-lo)/(hi-lo));
  const ticks=[0,.25,.5,.75,1].map(f=>lo+(hi-lo)*f);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟ ${esc(k.name)}">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${lab(t)}</text>`).join('')}
   ${[1,5,10,15,20,25,n].map(d=>`<text x="${x(d-1)}" y="${H-8}" text-anchor="middle">${d}</text>`).join('')}
   ${tl==null?'':`<line x1="${L}" x2="${W-R}" y1="${y(tl)}" y2="${y(tl)}" stroke="var(--ok)" stroke-dasharray="5 4"/>`}
   ${ser.map((s,j)=>{let p='',seg=[];s.forEach((v,i)=>{if(v==null){if(seg.length)p+='M'+seg.join('L');seg=[]}else seg.push(x(i).toFixed(1)+','+y(v).toFixed(1))});if(seg.length)p+='M'+seg.join('L');
     return `<path d="${p}" fill="none" stroke="${cols[j%5]}" stroke-width="2.2"/>${s.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${cols[j%5]}"><title>${esc(bs[j])} วันที่ ${i+1}: ${esc(fv(k,v,true))}</title></circle>`).join('')}`}).join('')}</svg>
   <div class="row sm">${bs.map((b,j)=>`<span><span style="display:inline-block;width:14px;height:4px;background:${cols[j%5]};vertical-align:middle"></span> ${esc(b)}</span>`).join('')}</div>`}

function impTopics(){const D=K.d.def,o=[];Object.entries(D.sets).forEach(([sn,st])=>st.kpis.forEach(k=>{if(!k.src&&!k.rmOnly)o.push([sn,k])}));return o}
function impParse(txt){const out=[];String(txt).replace(/^﻿/,'').split(/\r?\n/).forEach((ln,i)=>{const c=ln.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,''));if(!c[0]||!/\d/.test(c[0]))return;
  let d=c[0];const m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){let y=+m[3];if(y>2400)y-=543;d=y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  const v=parseFloat(String(c[2]||'').replace(/[%,\s]/g,''));out.push({line:i+1,date:d,branch:c[1],v:isNaN(v)?null:v,img:c[3]||''})});return out}

  else {body=`<div class="row"><label class="f">เริ่มคิดเงินแบบใหม่ตั้งแต่เดือน (ปปปป-ดด)<input id="g-from" value="${esc(P.from||'')}" style="width:110px" placeholder="2026-12"></label><label class="f">จ่ายหลังเดือนที่ประเมิน (เดือน)<input id="g-lag" value="${esc(P.payLag==null?1:P.payLag)}" style="width:60px"></label><label class="f">ผ่าน KPI เดือนนั้นเมื่อคะแนน ≥ (%)<input id="g-pass" value="${esc(P.passPct||80)}" style="width:70px"></label><label class="f">SPV / CRD ไม่ผ่านติดกันกี่เดือน → ปรับลดตำแหน่ง<input id="g-fm" value="${esc(P.failMonths||3)}" style="width:60px"></label></div>
    <div class="row" style="margin-top:6px"><label class="f">SPV ช่วยจ่ายค่าปรับที่บริษัทรับภาระ (%)<input id="g-share" value="${esc(Math.round((+P.fineShare||0)*100))}" style="width:70px"></label><label class="f">กรอกย้อนหลังได้ (วัน)<input id="g-ed" value="${esc(D.editDays)}" style="width:60px"></label></div>
    <h3>คลังใช้ชุดไหน</h3><div class="row">${Object.keys(D.branchSet).map(b=>`<label class="f">คลัง ${esc(b)}<select data-bs="${esc(b)}">${names.map(n=>`<option value="${esc(n)}"${D.branchSet[b]===n?' selected':''}>${esc(D.sets[n].name||n)}</option>`).join('')}<option value="">— ไม่ใช้ KPI —</option></select></label>`).join('')}<label class="f">เพิ่มคลัง<input id="t-nb" placeholder="รหัสคลัง" style="width:110px"></label></div>
    <p class="muted sm">ตัวอย่าง: เริ่ม 2026-12 จ่ายหลัง 1 เดือน = ประเมิน ธ.ค. 69 → จ่ายพร้อมเงินเดือน 31 ม.ค. 70 (เงินเดือน 31 ธ.ค. 69 ยังเป็นฐานเดิม)</p>`}
  return `<nav class="tabs sub">${tabs.map(([k,t])=>`<button type="button" data-stab="${k}" class="${K.stab===k?'on':''}">${t}</button>`).join('')}</nav>
  <div class="panel">${body}</div>
  <div class="row savebar"><button class="btn" id="t-save">บันทึกการตั้งค่า</button><button class="btn ghost" id="t-reset">ยกเลิกที่แก้</button><span class="muted sm">มีผลกับเดือนที่ยังไม่ปิดทันที · เดือนที่ปิดแล้วใช้เกณฑ์ ณ วันปิด</span></div>`}
function readSet(){const D=K.defEdit,st=D.sets[K.set];if(!st)return;const num=v=>{v=String(v==null?'':v).trim().replace(/,/g,'');return v===''?'':(isNaN(+v)?v:+v)};
  const sn=$('#t-sn');if(sn)st.name=sn.value.trim()||st.name;
  $$('[data-f]').forEach(el=>{const k=st.kpis[+el.dataset.i],f=el.dataset.f;if(!k)return;const v=el.value.trim();
    if(f==='kind'){delete k.rmOnly;delete k.info;if(v==='punch'){k.src='punch';k.agg='late';k.dir='lo';k.spvOnly=true;k.unit='ครั้งที่สาย';delete k.time;if(!hasTg(k))k.tg=0}else{if(k.src==='punch'){delete k.src;delete k.spvOnly;k.agg='avg';k.unit='%'}if(v==='rm')k.rmOnly=true;if(v==='info')k.info=true;if(v==='score')k._sc=true}}
    else if(f==='agg'){if(k.src)return;k.time=v==='time';k.agg=v==='sum'?'sum':'avg';if(k.time)k.unit='เวลา'}
    else if(f==='w')k.w=v===''?1:+v;
    else if(f==='tg'){if(k.time&&toMin(v)!=null){const m=toMin(v);k.tg=m<360?m+1440:m}else k.tg=num(v);if(k.info&&k.tg!=='')delete k.info}
    else k[f]=v});
  const P=D.program;const C=P&&P.bySet&&P.bySet[K.set];
  if(C){$$('[data-m]').forEach(el=>{const f=el.dataset.m;if(f==='active'){C.active=el.checked;return}const pct=f.endsWith('%'),key=pct?f.slice(0,-1):f,parts=key.split('.');let v=el.tagName==='SELECT'||f==='crashName'||f==='crashAfter'?el.value.trim():num(el.value);if(pct)v=(+v||0)/100;
      if(parts.length===2){C[parts[0]]=C[parts[0]]||{};C[parts[0]][parts[1]]=v}else C[key]=v});
    $$('[data-tier]').forEach(el=>{const[i,j]=el.dataset.tier.split('|').map(Number);C.tiers[i][j]=num(el.value)})}
  if($('#r-cf')){const R=D.rm;R.crashFine=+num($('#r-cf').value)||0;R.kpiMax=+num($('#r-km').value)||0;R.branches=$$('[data-rb]').filter(c=>c.checked).map(c=>c.dataset.rb);
    $$('[data-rf]').forEach(el=>{const k=R.topics[+el.dataset.i],f=el.dataset.rf;if(f==='tg')k.tg=num(el.value);else k[f]=el.value.trim()})}
  if($('#g-from')){P.from=$('#g-from').value.trim();P.payLag=+num($('#g-lag').value)||0;P.passPct=+num($('#g-pass').value)||0;P.failMonths=+num($('#g-fm').value)||3;P.fineShare=(+num($('#g-share').value)||0)/100;D.editDays=Math.max(0,+num($('#g-ed').value)||0);
    $$('[data-bs]').forEach(el=>{if(el.value)D.branchSet[el.dataset.bs]=el.value;else delete D.branchSet[el.dataset.bs]});const nb=$('#t-nb');if(nb&&nb.value.trim())D.branchSet[nb.value.trim()]=K.set}}
function bindSet(){const D=K.defEdit,re=()=>{readSet();render()},st=()=>D.sets[K.set];
  $$('[data-stab]').forEach(b=>b.onclick=()=>{readSet();K.stab=b.dataset.stab;render()});
  $$('[data-setp]').forEach(b=>b.onclick=()=>{readSet();K.set=b.dataset.setp;render()});
  $$('[data-f="kind"],[data-f="agg"],[data-m="crashMode"]').forEach(s=>s.onchange=re);
  if($('#t-addset'))$('#t-addset').onclick=()=>{readSet();let i=1;while(D.sets['SET'+i])i++;D.sets['SET'+i]={name:'ชุดใหม่ '+i,kpis:[{id:'k'+Date.now().toString(36),name:'หัวข้อใหม่',unit:'%',dir:'hi',tg:'',agg:'avg',w:1}]};K.set='SET'+i;render()};
  if($('#t-add'))$('#t-add').onclick=()=>{readSet();st().kpis.push({id:'k'+Date.now().toString(36),name:'หัวข้อใหม่',unit:'%',dir:'hi',tg:'',agg:'avg',w:1});render()};
  if($('#t-addat'))$('#t-addat').onclick=()=>{readSet();st().kpis.push({id:'at'+Date.now().toString(36),name:'SPV เข้างานตรงเวลา (จากการลงเวลา)',unit:'ครั้งที่สาย',dir:'lo',tg:0,agg:'late',src:'punch',at:'07:00',spvOnly:true,w:1});render()};
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='ยืนยันลบ';return}readSet();if(st().kpis.length<2){toast('ต้องมีอย่างน้อย 1 หัวข้อ');return}st().kpis.splice(+b.dataset.del,1);render()});
  $$('[data-up]').forEach(b=>b.onclick=()=>{readSet();const i=+b.dataset.up;if(i>0){const a=st().kpis;[a[i-1],a[i]]=[a[i],a[i-1]]}render()});
  $$('[data-tdel]').forEach(b=>b.onclick=()=>{readSet();D.program.bySet[K.set].tiers.splice(+b.dataset.tdel,1);render()});
  if($('#t-tadd'))$('#t-tadd').onclick=()=>{readSet();const T=D.program.bySet[K.set].tiers;const l=T[T.length-1];T.push([l?(+l[1]||+l[0])+1:0,'',0,0]);render()};
  $('#t-reset').onclick=()=>{K.defEdit=null;render()};
  $('#t-save').onclick=async()=>{readSet();for(const s of Object.values(D.sets))for(const k of s.kpis){if(!k.name){toast('มีหัวข้อที่ไม่มีชื่อ');return}if(k.tg!==''&&k.tg!=null&&isNaN(k.tg)){toast('"'+k.name+'" เป้าหมายต้องเป็นตัวเลข');return}}
    try{await api('kpiSetDef',{def:D});K.defEdit=null;await load();toast('บันทึกการตั้งค่าแล้ว')}catch(e){toast(e.message)}}}

(async()=>{if(K.tok){try{await load()}catch(e){K.d=null;render()}}else render()})();
</script></body></html>
