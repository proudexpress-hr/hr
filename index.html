<style>
/* Layout: red company band on top, one working column (max 980px); employee side = task tiles, back office = tabs + tables */

}

[hidden]{display:none!important}

.doc-ol{margin:6px 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.letter.doc{margin:6px 0}
.tsearch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pick-q{margin-bottom:4px}
#c-loc,#c-sim,#c-file,.demo-acc,#adm-out,#a-fill,#__none{display:none!important}.rl-bar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:10px;gap:8px}
.dx{display:flex;gap:6px;align-items:center;position:relative;width:100%}.dx input[type=text]{flex:1;min-width:0}.dx input.bad{border-color:var(--bad);outline-color:var(--bad)}

.gridwrap{max-height:70vh}.attgrid{font-size:.78rem;border-collapse:separate;border-spacing:0}.attgrid th,.attgrid td{padding:0;border-bottom:1px solid var(--line);text-align:center}

<header class="top"><div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ===== ใส่ URL ของ Apps Script (Deploy > Web app) ระหว่างเครื่องหมาย ' ' =====
const API_URL='https://script.google.com/macros/s/AKfycbw2Gf7NX4huSWPWLx257MhUwB2EHxhowh0ugVg61_rAaLufeJaAUrvmRqJLkBFLFUFA/exec';
// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())})();
const D=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const th=s=>{if(typeof s==='string'&&s&&!/^\d{4}-\d{2}-\d{2}/.test(s))return s;const d=typeof s==='string'?D(s):s;return d?d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543):'-'};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const money=n=>n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function idCheck(base12){let s=0;for(let i=0;i<12;i++)s+=+base12[i]*(13-i);return base12+((11-s%11)%10)}
function idValid(v){return /^\d{13}$/.test(v)&&idCheck(v.slice(0,12))===v}
const readImg=f=>readImgReal(f);const _readImgDemo=f=>new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});

// ---------- settings (ในระบบจริงอยู่ในชีต "ตั้งค่า") ----------
const BRANCHES=['301675','301710','301714','301717','ออฟฟิศ'];

function leaveUsed(empId,type,year){return S.leave.filter(l=>l.emp===empId&&l.type===type&&l.status!=='ไม่อนุมัติ'&&D(l.from).getFullYear()===year).reduce((a,l)=>a+l.paid,0)}
function quota(emp,type){const r=LEAVE[type];if(r.needYear&&(!emp.start||daysBetween(D(emp.start),TODAY)<365))return 0;return r.paid}
function countDays(from,to,part){if(!from||!to)return 0;const n=daysBetween(D(from),D(to))+1;if(n<1)return 0;return n===1&&part!=='full'?.5:n}
function splitLeave(emp,type,days){const q=quota(emp,type);const left=Math.max(0,q-leaveUsed(emp.id,type,TODAY.getFullYear()));const paid=Math.min(days,left);return{q,left,paid,unpaid:+(days-paid).toFixed(1)}}

const getSig=id=>S.sigs[id]||null;
function initSigs(){document.querySelectorAll('canvas.sig-pad').forEach(cv=>{const g=cv.getContext&&cv.getContext('2d');if(!g)return;g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1a1a8c';
  if(S.sigs[cv.id]){const im=new Image();im.onload=()=>g.drawImage(im,0,0);im.src=S.sigs[cv.id]}
  let dn=false,moved=false;const pt=ev=>{const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=ev=>{dn=true;moved=false;cv.setPointerCapture&&cv.setPointerCapture(ev.pointerId);const[x,y]=pt(ev);g.beginPath();g.moveTo(x,y)};
  cv.onpointermove=ev=>{if(!dn)return;const[x,y]=pt(ev);g.lineTo(x,y);g.stroke();moved=true};
  cv.onpointerup=cv.onpointercancel=()=>{if(dn&&moved)S.sigs[cv.id]=cv.toDataURL('image/png');dn=false}});
  document.querySelectorAll('[data-sigclr]').forEach(b=>b.onclick=()=>{const cv=document.getElementById(b.dataset.sigclr);const g=cv.getContext&&cv.getContext('2d');if(g)g.clearRect(0,0,cv.width,cv.height);delete S.sigs[b.dataset.sigclr]})}
function needSig(id){const v=getSig(id);if(!v){toast('กรุณาลงลายมือชื่อก่อนส่ง');const c=document.getElementById(id);if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'});return null}return v}

function cardView(e,who){

  if(st!=='รอแจกบัตร')return `<section class="panel"><h2>บัตรประกันอุบัติเหตุ</h2>${who}<div class="note warn">${st==='ยังไม่ครบ 119 วัน'?`ยังไม่มีบัตร บริษัททำบัตรให้เมื่อทำงานครบ ${INS_WAIT} วัน (${th(eligDate(e))})`:st==='รอแจ้งเข้า'?'ครบกำหนดแล้ว กำลังส่งรายชื่อให้บริษัทประกัน':!st?'ตำแหน่งนี้ไม่อยู่ในกลุ่มทำบัตรประกัน':st}</div></section>`;

// ----- อัตรากำลัง: ปริมาณพัสดุ vs จำนวนคน -----
const HC_POS={'คัดแยก':'คัดแยก','ADMIN':'แอดมิน'};
const volOf=(b,d)=>{const v=S.vol.find(x=>x.branch===b&&x.date===d);return v?v.n:null};
function volAvg(b){const v=[];for(let i=0;i<S.hcDays;i++){const n=volOf(b,iso(addDays(TODAY,-i)));if(n!=null)v.push(n)}return v.length?v.reduce((a,x)=>a+x,0)/v.length:0}
const headOf=(b,pos)=>S.emp.filter(e=>e.branch===b&&e.pos===pos&&e.status==='ทำงาน').length;
function hcStatus(b,pos){const avg=volAvg(b),allow=avg?Math.ceil(avg/S.hcRatio[pos]):0,act=headOf(b,pos);
  const extra=S.hcReq.filter(r=>r.branch===b&&r.pos===pos&&r.kind==='เพิ่มคน'&&r.status==='อนุมัติ').reduce((a,r)=>a+r.qty-fillsOf(r).length,0);
  return{avg,allow,act,extra,room:allow-act,canAdd:act<allow||extra>0}}
const REQ_POS=['คัดแยก','ADMIN','พนักงานนำจ่ายพัสดุ','พนักงานรับพัสดุ','พนักงานขับรถบริษัท','พาร์ทไทม์','SPV'];
const posName=p=>HC_POS[p]||p;
const fillsOf=r=>r.fills||[];
function reqState(r){if(r.status!=='อนุมัติ'||r.kind!=='เพิ่มคน')return r.status;const n=fillsOf(r).length;return n>=r.qty?'ได้ครบแล้ว':n?'ได้บางส่วน':'กำลังหาคน'}
function openReqs(b,pos){return S.hcReq.filter(r=>r.branch===b&&r.pos===pos&&r.kind==='เพิ่มคน'&&r.status==='อนุมัติ'&&fillsOf(r).length<r.qty).sort((x,y)=>x.approvedDate<y.approvedDate?-1:1)}
function fillDays(r,f){return daysBetween(D(r.approvedDate||r.date),D(f.date))}
function hrKpi(){
  const L=S.hcReq.filter(r=>inScope(r.branch)&&r.kind==='เพิ่มคน'&&r.status==='อนุมัติ');
  const need=L.reduce((a,r)=>a+r.qty,0),got=L.reduce((a,r)=>a+Math.min(r.qty,fillsOf(r).length),0);
  const ds=L.flatMap(r=>fillsOf(r).map(f=>fillDays(r,f)));const avg=ds.length?ds.reduce((a,x)=>a+x,0)/ds.length:0;
  const late=L.filter(r=>fillsOf(r).length<r.qty&&((r.needBy&&D(r.needBy)<TODAY)||daysBetween(D(r.approvedDate||r.date),TODAY)>S.fillSla));
  const grp=k=>{const m={};L.forEach(r=>{const g=k(r);m[g]=m[g]||{need:0,got:0,d:[]};m[g].need+=r.qty;m[g].got+=Math.min(r.qty,fillsOf(r).length);fillsOf(r).forEach(f=>m[g].d.push(fillDays(r,f)))});return m};
  const tbl=(m,lab)=>`<div class="tablewrap"><table><tr><th>${lab}</th><th class="num">ขอ (คน)</th><th class="num">ได้แล้ว</th><th class="num">อัตราสำเร็จ</th><th class="num">เฉลี่ยวันที่หาได้</th></tr>${Object.entries(m).map(([g,v])=>`<tr><td>${esc(posName(g))}</td><td class="num">${v.need}</td><td class="num">${v.got}</td><td class="num">${Math.round(v.got/v.need*100)}%</td><td class="num">${v.d.length?(v.d.reduce((a,x)=>a+x,0)/v.d.length).toFixed(1):'-'}</td></tr>`).join('')}</table></div>`;
  return `<div class="panel" style="background:var(--bg)"><h3>ผลการหาคนของ HR</h3>
  <p class="muted">นับจากคำขอ "เพิ่มคน" ที่อนุมัติแล้ว · ผูกกับผู้สมัครตอนกดอนุมัติเข้าทะเบียน · วันที่หาได้ = วันอนุมัติคำขอ → วันรับเข้าทะเบียน · เป้าหมาย ${S.fillSla} วัน</p>
  <div class="stats"><div class="stat"><b>${need}</b><span>ตำแหน่งที่ขอ (คน)</span></div><div class="stat"><b>${got}</b><span>หาได้แล้ว</span></div><div class="stat"><b>${need?Math.round(got/need*100):0}%</b><span>อัตราสำเร็จ</span></div><div class="stat"><b>${avg?avg.toFixed(1):'-'}</b><span>เฉลี่ยวันที่หาได้</span></div><div class="stat ${late.length?'alert':''}"><b>${late.length}</b><span>คำขอเกินกำหนดยังไม่ครบ</span></div></div>
  ${late.length?`<div class="note warn"><b>เกินกำหนด:</b> ${late.map(r=>`${r.no} ${r.branch} ${esc(posName(r.pos))} ได้ ${fillsOf(r).length}/${r.qty} · ค้างมา ${daysBetween(D(r.approvedDate||r.date),TODAY)} วัน`).join(' · ')}</div>`:''}
  <div class="split"><div><h3>แยกตามตำแหน่ง</h3>${tbl(grp(r=>r.pos),'ตำแหน่ง')}</div><div><h3>แยกตามสาขา</h3>${tbl(grp(r=>r.branch),'สาขา')}</div></div></div>`;
}

    <td>${r.status==='รออนุมัติ'&&can('users')?`<div class="row" style="gap:4px;flex-wrap:nowrap"><input id="hcn-${r.no}" placeholder="หมายเหตุ" style="width:120px"><button class="btn ok sm" data-hcok="${r.no}" data-s="อนุมัติ">อนุมัติ</button><button class="btn ghost sm" data-hcok="${r.no}" data-s="ไม่อนุมัติ">ไม่อนุมัติ</button></div>`:`<span class="pill ${r.status==='อนุมัติ'?'p-ok':r.status==='ไม่อนุมัติ'?'p-bad':'p-warn'}">${r.status}</span>${r.kind==='เพิ่มคน'&&r.status==='อนุมัติ'?(()=>{const st=reqState(r),fs=fillsOf(r);const dd=daysBetween(D(r.approvedDate||r.date),fs.length>=r.qty?D(fs[fs.length-1].date):TODAY);return ` <span class="pill ${st==='ได้ครบแล้ว'?'p-ok':st==='ได้บางส่วน'?'p-warn':'p-n'}">${st} ${fs.length}/${r.qty}</span><br><small class="muted">${fs.length>=r.qty?'ใช้เวลา':'เปิดมาแล้ว'} ${dd} วัน${r.needBy?' · ต้องการภายใน '+th(r.needBy):''}</small>${fs.length?`<br><small>${fs.map(f=>esc(E(f.emp).name)+' ('+th(f.date)+')').join(', ')}</small>`:''}`})():''}`}</td></tr>`}).join('');

const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
function tenure(e){if(!e.start)return '-';const a=D(e.start),b=e.endDate?D(e.endDate):TODAY;if(b<a)return 'ยังไม่เริ่มงาน';let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return [y?y+' ปี':'',m?m+' เดือน':'',(d||(!y&&!m))?d+' วัน':''].filter(Boolean).join(' ')}
function probation(e){if(e.probation)return e.probation;if(!e.start)return 'ไม่ทราบ';return daysBetween(D(e.start),TODAY)>=INS_WAIT?'ผ่านทดลองงาน':'ทดลองงาน'}
const probPill=e=>{const p=probation(e);return `<span class="pill ${p==='ผ่านทดลองงาน'?'p-ok':p==='ทดลองงาน'?'p-warn':p.startsWith('ไม่ผ่าน')?'p-bad':'p-n'}">${p}</span>`};
function contractEnd(start){const d=D(start)||TODAY;const y=d.getFullYear();const end=new Date(y,11,24);return d>end?new Date(y+1,11,24):end}
const curEnd=e=>{const s0=D(e.start)||TODAY;return contractEnd(iso(s0>TODAY?s0:TODAY))};
const curBegin=e=>{const en=curEnd(e),s0=D(e.start)||TODAY,b=new Date(en.getFullYear()-1,11,25);return s0>b?s0:b};
const contractNo=e=>'PE-C'+(curEnd(e).getFullYear()+543)+'-'+e.branch+'-'+e.id.slice(3);

const EVAL_CRIT=['ความตรงต่อเวลา / การมาทำงาน','คุณภาพของงาน (ถูกต้อง ครบถ้วน)','ปริมาณงาน / ความรวดเร็ว','ความรับผิดชอบ / วินัย','การปฏิบัติตามกฎระเบียบบริษัท','การทำงานร่วมกับผู้อื่น / มารยาทกับลูกค้า'];
function evalDue(){const out=[];S.emp.filter(e=>inScope(e.branch)&&e.status==='ทำงาน'&&e.pos!=='พาร์ทไทม์'&&probation(e)==='ทดลองงาน'&&e.start).forEach(e=>{for(let r=1;r<=3;r++){if(S.evals.some(v=>v.emp===e.id&&v.round===r))continue;const due=addMonths(D(e.start),r);out.push({e,r,due});break}});return out.sort((a,b)=>a.due-b.due)}

     <br>(2) มูลค่าพัสดุที่สูญหายหรือเสียหายขณะอยู่ในความรับผิดชอบของข้าพเจ้า ตามมูลค่าที่บริษัทต้องชดใช้จริง

 <li><b>ข้อมูลอ่อนไหว</b> บริษัท<b>ไม่ต้องการ</b>ข้อมูลศาสนาและหมู่โลหิต ให้ปิดหรือขีดฆ่าบนสำเนาบัตรก่อนแนบ · ใบรับรองแพทย์ใช้เฉพาะเรื่องการลาตามกฎหมายคุ้มครองแรงงาน · บริษัทไม่เก็บประวัติอาชญากรรม เว้นแต่ได้รับความยินยอมโดยชัดแจ้ง · รูปถ่ายตอนลงเวลาให้หัวหน้างานตรวจด้วยตา ไม่ใช้ระบบจดจำใบหน้าอัตโนมัติ</li>
 <li><b>วัตถุประสงค์และฐานทางกฎหมาย</b> พิจารณารับสมัคร ทำสัญญาและบริหารการทำงาน (ม.24(3)) จ่ายค่าตอบแทน ภาษี ประกันสังคม (ม.24(6)) ลงเวลาทำงาน ป้องกันการทุจริต และดูแลความปลอดภัย (ม.24(5)) ป้องกันอันตรายต่อชีวิต (ม.24(2)) · เรื่องที่ต้องใช้ความยินยอม บริษัทจะขอแยกต่างหากและถอนได้ทุกเมื่อ</li>
 <li><b>ผู้ที่บริษัทเปิดเผยข้อมูลให้</b> J&T Express (รหัสพนักงาน) ธนาคารกสิกรไทย บริษัทประกัน (KTAXA) กรมสรรพากร สำนักงานประกันสังคม สำนักงานบัญชี หน่วยงานรัฐเมื่อกฎหมายกำหนด และ Google ในฐานะผู้ให้บริการระบบจัดเก็บ (อาจเก็บในเซิร์ฟเวอร์ต่างประเทศภายใต้มาตรฐานความปลอดภัยของผู้ให้บริการ)</li>
 <li><b>ระยะเวลาเก็บ</b> ผู้สมัครที่ไม่ได้รับเลือก ${PDPA.keep.appDays} วันหลังแจ้งผล (หรือ ${PDPA.keep.appKeepYears} ปีถ้ายินยอมให้เก็บ) · พนักงาน ${PDPA.keep.empYears} ปีหลังพ้นสภาพ · ข้อมูลเวลาทำงาน ${PDPA.keep.timeYears} ปี · รูปถ่ายตอนลงเวลา ${PDPA.keep.photoMonths} เดือน · ครบกำหนดแล้วบริษัทลบหรือทำให้ระบุตัวตนไม่ได้</li>
 <li><b>การรักษาความปลอดภัย</b> จำกัดสิทธิ์การเข้าถึงตามหน้าที่ หัวหน้างานเห็นเลขบัตรและบัญชีแบบปิดบางส่วน การเปิดดูข้อมูลเต็มถูกบันทึกไว้</li>
 <li><b>สิทธิ์ของคุณ</b> ขอดู/ขอสำเนา ขอแก้ไข ขอลบ ขอระงับ คัดค้าน ขอรับข้อมูลเป็นไฟล์ และถอนความยินยอม ผ่านเมนู "ข้อมูลส่วนบุคคลของฉัน" บริษัทจะตอบภายใน ${PDPA.dueDays} วัน · บางคำขออาจปฏิเสธได้ถ้ากฎหมายกำหนดให้บริษัทต้องเก็บ (เช่น ข้อมูลภาษี) โดยจะแจ้งเหตุผล · ร้องเรียนต่อสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (สคส.) ได้</li>
 <li><b>ถ้าไม่ให้ข้อมูล</b> ข้อมูลที่จำเป็นต่อการจ้างงานและการจ่ายเงิน ถ้าไม่ให้ บริษัทอาจพิจารณารับเข้าทำงานหรือจ่ายเงินไม่ได้</li></ol>`}

function pdpaDue(){const today=TODAY,out=[];
  S.apps.forEach(a=>{if(a.pdpaDel||a.status==='อนุมัติ')return;if(!['ไม่ผ่าน','สละสิทธิ์','บล็อก'].includes(a.status))return;const keep=consNow(a.no,'keepApp');const due=keep?new Date(D(a.decDate||a.date).getFullYear()+PDPA.keep.appKeepYears,D(a.decDate||a.date).getMonth(),D(a.decDate||a.date).getDate()):addDays(D(a.decDate||a.date),PDPA.keep.appDays);if(due<=today)out.push({kind:'app',ref:a.no,name:a.title+a.name,what:'ใบสมัคร ('+a.status+')'+(keep?' · ยินยอมให้เก็บ 1 ปี':''),due})});
  S.emp.forEach(e=>{if(e.pdpaDel||e.status!=='พ้นสภาพ'||!e.endDate)return;const d=D(e.endDate),due=new Date(d.getFullYear()+PDPA.keep.empYears,d.getMonth(),d.getDate());if(due<=today)out.push({kind:'emp',ref:e.id,name:e.name,what:'ข้อมูลพนักงานพ้นสภาพ',due})});
  const cut=new Date(today.getFullYear(),today.getMonth()-PDPA.keep.photoMonths,today.getDate());const ph=S.punch.filter(p=>(p.photo||p.photoOut)&&D(p.date)<cut);if(ph.length)out.push({kind:'photo',ref:'photo',name:'-',what:'รูปถ่ายลงเวลา '+ph.length+' รูป เก่ากว่า '+PDPA.keep.photoMonths+' เดือน',due:cut});
  return out}

const WATCH={apps:['ใบสมัครงาน'],emp:['พนักงานลงทะเบียน',r=>r.status==='รอตรวจสอบ'],leave:['ใบลา'],resign:['ใบลาออก'],moves:['โยกย้าย'],hcReq:['ขอเพิ่มคน'],dsr:['คำขอข้อมูลส่วนบุคคล'],assets:['แจ้งของที่ถือ',r=>r.by==='พนักงานแจ้งเอง'&&!r.ok],msgs:['ข้อความจากพนักงาน',r=>r.lastT==='emp',r=>r.no+'|'+(r.log||[]).length],fixReq:['พนักงานแก้ไขตามที่แจ้ง',r=>r.status==='พนักงานแก้แล้ว',r=>r.no+'|'+r.status+'|'+(r.log||[]).length]};

  const found={};Object.entries(WATCH).forEach(([c,[lab,f]])=>{const local=new Set((S[c]||[]).map(WK(c)));(r.data[c]||[]).forEach(x=>{const k=WK(c)(x);if(REAL.seen[c].has(k)||local.has(k))return;if(f&&!f(x))return;(found[lab]=found[lab]||new Set()).add(k)})});
  const before=Object.values(REAL.newItems).reduce((a,v)=>a+v.size,0);Object.entries(found).forEach(([l,set])=>{REAL.newItems[l]=new Set([...(REAL.newItems[l]||[]),...set])});
  const after=Object.values(REAL.newItems).reduce((a,v)=>a+v.size,0);

REAL.newText=()=>Object.entries(REAL.newItems).filter(([l,v])=>v.size).map(([l,v])=>l+' '+v.size).join(' · ');

  if(!n){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='rl-new';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:999;background:var(--brand,#b0121e);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);flex-wrap:wrap';document.body.appendChild(b)}

    m('กำลังตรวจสอบ…');try{const r=await api('loginBo',p);if(r.mustChange){$('#bo-new').hidden=false;m('ตั้งรหัสผ่านใหม่ก่อนใช้งาน');return}REAL.token=r.token;try{sessionStorage.setItem('hr_t',r.token)}catch(e){}await REAL.load();S.view='adm';S.role={email:REAL.me.user,name:REAL.me.name,role:REAL.me.role,branch:REAL.me.branch};_render()}catch(e){m(e.message)}});
  on('#logout',()=>REAL.logout());on('#rl-out',()=>REAL.logout());on('#rl-ref',()=>REAL.refresh());
  on('#rl-ntf',async()=>{if(!window.Notification)return toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน ระบบจะขึ้นแถบแจ้งในหน้าแทน');const p=await Notification.requestPermission();toast(p==='granted'?'เปิดแจ้งเตือนแล้ว · เปิดหน้านี้ทิ้งไว้ ระบบจะเช็กทุก 1–2 นาที':'ไม่ได้อนุญาต · ยังมีแถบแจ้งในหน้าเหมือนเดิม');_render()});
  if(!REAL.token)document.querySelectorAll('[data-go]').forEach(b=>{const f=b.onclick;b.onclick=ev=>{S.who=null;S.oldDone=null;f&&f(ev)}});

  document.querySelectorAll('[data-upw]').forEach(b=>b.onclick=()=>{S.upwUser=b.dataset.upw;_render()});
  on('#upw-save',async()=>{const p=$('#upw-p').value;if(p.length<8){toast('รหัสผ่านอย่างน้อย 8 ตัว');return}try{await REAL.flush();await api('setUserPass',{user:S.upwUser,pass:p});toast('ตั้งรหัสผ่านชั่วคราวแล้ว ผู้ใช้ต้องเปลี่ยนตอนเข้าครั้งแรก');S.upwUser=null;_render()}catch(e){toast(e.message)}});
  on('#upw-cancel',()=>{S.upwUser=null;_render()});
  on('#cp-save',async()=>{try{await api('changePass',{old:$('#cp-o').value,pass:$('#cp-n').value});toast('เปลี่ยนรหัสผ่านแล้ว');S.cpOpen=false;_render()}catch(e){toast(e.message)}});

  // รูป/ไฟล์ที่เก็บใน Drive
  document.querySelectorAll('img[src^="drive:"],img[data-drive]').forEach(im=>{const id=(im.getAttribute('src')||'').startsWith('drive:')?im.getAttribute('src'):im.dataset.drive;im.removeAttribute('src');im.dataset.drive=id;REAL.blob(id).then(u=>{if(u.startsWith('data:image'))im.src=u}).catch(()=>{})});
  document.querySelectorAll('[data-dzoom]').forEach(b=>b.onclick=async()=>{try{const u=await REAL.blob(b.dataset.dzoom);const nm=(b.querySelector('span')||{}).textContent||'file',okDl=S.role&&['admin','hr'].includes(S.role.role),ext=(u.match(/^data:[^/]+\/([a-z0-9]+)/)||[,'bin'])[1].replace('jpeg','jpg');const dl=$('#lb-dl');if(dl){dl.hidden=!okDl;dl.href=u;dl.download=nm+'.'+ext;dl.onclick=()=>{api('log',{detail:'file '+nm+' '+b.dataset.dzoom}).catch(()=>{})}}if(u.startsWith('data:image')){$('#lb-img').src=u;$('#lb-t').textContent=nm;$('#lb').hidden=false}else if(okDl){const a=document.createElement('a');a.href=u;a.download=nm+'.'+ext;document.body.appendChild(a);a.click();a.remove();api('log',{detail:'file '+nm}).catch(()=>{})}else{const w=window.open();if(w)w.document.write('<iframe src="'+u+'" style="border:0;width:100%;height:100vh"></iframe>')}}catch(e){toast(e.message)}});

REAL.blob=function(id){if(!REAL.blobs.has(id))REAL.blobs.set(id,api('blob',{id:id.slice(6)}));return REAL.blobs.get(id)};
function geoReal(e){const g=ATT.geo[e.branch];if(S.gpsErr&&!S.gps)return{ok:false,dist:null,txt:S.gpsErr};if(!S.gps)return{ok:false,dist:null,txt:'กำลังหาตำแหน่ง GPS… (กดอนุญาตตำแหน่ง)'};if(!g)return{ok:false,dist:null,txt:'ยังไม่ได้ตั้งพิกัดสาขา '+e.branch+' ติดต่อแอดมิน'};
  const R=6371000,r=x=>x*Math.PI/180,a=Math.sin(r(g.lat-S.gps.lat)/2)**2+Math.cos(r(S.gps.lat))*Math.cos(r(g.lat))*Math.sin(r(g.lng-S.gps.lng)/2)**2,d=Math.round(2*R*Math.asin(Math.sqrt(a)));
  if(S.gps.acc>ATT.accMax)return{ok:false,dist:d,txt:'สัญญาณ GPS คลาดเคลื่อน '+S.gps.acc+' ม. (ต้องไม่เกิน '+ATT.accMax+') ลองใหม่ในที่โล่ง'};
  return d<=g.r?{ok:true,dist:d,txt:'อยู่ในพื้นที่สาขา '+e.branch+' ห่าง '+d+' ม.'}:{ok:false,dist:d,txt:'อยู่นอกรัศมีสาขา '+e.branch+' (ห่าง '+(d>=1000?(d/1000).toFixed(1)+' กม.':d+' ม.')+' · รัศมี '+g.r+' ม.) ลงเวลาไม่ได้'}}
const gpsF=sfx=>S.gps?{['lat'+(sfx||'')]:S.gps.lat,['lng'+(sfx||'')]:S.gps.lng,['acc'+(sfx||'')]:S.gps.acc,lat:S.gps.lat,lng:S.gps.lng,acc:S.gps.acc}:{};

  const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.82))};im.onerror=()=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)};im.src=u});
